<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO / Open Graph (inyectado desde src/data/config.js en build y dev) -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="theme-color" content="%THEME_COLOR%" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="%SEO_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:image" content="%SEO_IMAGE%" />
    <meta property="og:url" content="%SEO_URL%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%SEO_IMAGE%" />

    <link rel="stylesheet" href="css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Great+Vibes&display=swap"
        rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="./assets/img/anillos.webp" />
</head>

<body>
    <!-- 1. Portada -->
    <header class="hero-header">
        <div class="hero-content">
            <h2 class="title" data-text="portada.titulo"></h2>
            <h1 class="names" data-text="nombresNovios"></h1>
            <p class="invitation" data-text="portada.mensaje"></p>
        </div>
        <p class="scroll-down" data-text="portada.textoScroll"></p>
    </header>

    <section class="anillo">
        <img src="./assets/img/anillos.webp" alt="Anillos de boda" loading="lazy" />
    </section>

    <!-- 2. Fecha -->
    <section class="section calendar">
        <h2 class="titulo" data-text="seccionFecha.titulo"></h2>
        <p id="wedding-date"></p>
        <p id="wedding-hour"></p>
        <img class="calendario" src="./assets/img/calendario_sin_fondo_negrita.webp" alt="Calendario de la boda"
            loading="lazy" />
        <!-- Botones "Agregar al calendario" (generados por calendar.js) -->
        <div class="calendar-actions" id="calendar-actions"></div>
    </section>

    <!-- 3. Nuestra historia -->
    <section class="section historia">
        <h2 class="titulo" data-text="historia.titulo"></h2>
        <div class="historia-layout">
            <!-- CARRUSEL SWIPER -->
            <div class="carousel-section">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper" id="swiper-wrapper"></div>
                    <!-- Paginación -->
                    <div class="swiper-pagination"></div>
                </div>
            </div>

            <!-- TEXTO -->
            <div class="historia-texto">
                <p class="texto-general" data-text="historia.texto"></p>
            </div>
        </div>
    </section>

    <!-- 4. Bendición: padres y padrinos -->
    <section class="section bendicion">
        <h3 class="titulo texto-bendicion-dios" data-text="bendicion.tituloSuperior"></h3>

        <div class="bendicion-grid" id="bendicion-grid"></div>

        <h3 class="titulo texto-bendicion-dios" data-html="bendicion.tituloInferior"></h3>
    </section>

    <!-- 5. Ubicación -->
    <section class="section">
        <div class="icono-gps" id="icono-gps"></div>
        <h2 class="titulo" data-text="lugar.titulo"></h2>
        <p class="texto-general" data-text="lugar.descripcion"></p>

        <div class="ubicacion-container">
            <a id="btnMapa" target="_blank" rel="noopener noreferrer" class="btn-ver-ubicacion">
                <svg class="animated-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20"
                    fill="currentColor">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
                </svg>
                <span>Ver en mapa</span>
            </a>
        </div>
    </section>

    <!-- 6. Cuenta regresiva -->
    <section class="section-countdown">
        <div class="calendar-icon" id="icono-calendar"></div>
        <div class="header-countdown">
            <h2 id="faltan" class="titulo" data-text="countdown.titulo"></h2>
        </div>
        <div class="countdown-container">
            <div class="countdown-card">
                <div id="countdown" class="countdown">
                    <div class="timer-box">
                        <span id="days" class="timer-number">0</span>
                        <span class="timer-label">Días</span>
                    </div>
                    <div class="timer-box">
                        <span id="hours" class="timer-number">00</span>
                        <span class="timer-label">Horas</span>
                    </div>
                    <div class="timer-box">
                        <span id="minutes" class="timer-number">00</span>
                        <span class="timer-label">Minutos</span>
                    </div>
                    <div class="timer-box">
                        <span id="seconds" class="timer-number">00</span>
                        <span class="timer-label">Segundos</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 7. Foto manos y cita bíblica -->
    <section class="section">
        <div class="historia-contenido container">
            <div class="foto-historia">
                <img src="./assets/img/foto_manos.webp" alt="Manos de los novios" loading="lazy" />
            </div>

            <div class="cita-biblica">
                <p data-text="citaBiblica.texto"></p>
                <strong class="referencia-biblica" data-text="citaBiblica.referencia"></strong>
            </div>
        </div>
    </section>

    <!-- 8. Dresscode -->
    <section class="section dresscode-section">
        <h2 class="titulo" data-text="dresscode.titulo"></h2>
        <div class="dresscode-contenido">
            <img src="./assets/img/dresscode.svg" alt="Dresscode" class="dresscode-img" loading="lazy">
            <p class="texto-general texto-dress-code" data-text="dresscode.texto"></p>
        </div>
    </section>

    <!-- 9. Regalos -->
    <section class="section regalos-section">
        <h2 class="titulo" data-text="regalos.titulo"></h2>

        <div class="regalos-contenido">
            <div class="regalo-icon" id="icono-regalo"></div>
            <div class="texto-regalos" id="texto-regalos"></div>
        </div>
    </section>

    <!-- 9.1 Datos bancarios (generados por render.js) -->
    <section class="section info-banco" id="info-banco"></section>

    <!-- 10. Confirmación de asistencia -->
    <section class="section">
        <h2 class="titulo" data-text="confirmacion.titulo"></h2>
        <p class="texto-general" id="confirmacion-intro"></p>
        <p class="texto-general">
            <strong data-text="confirmacion.llamado"></strong>
        </p>
        <div class="whatsapp-buttons" id="whatsapp-buttons"></div>
    </section>

    <!-- 11. Reproductor de música -->
    <audio autoplay id="bg-music" muted>
        <source id="bg-music-source" src="" type="audio/mpeg" />
        Tu navegador no soporta el audio.
    </audio>

    <div id="music-modal" class="modal-overlay">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <h2 data-text="musica.tituloModal"></h2>
                    <button id="start-music-btn" data-text="musica.textoBoton"></button>
                </div>
            </div>
        </div>
    </div>

    <button id="toggle-music-btn" class="music-toggle-btn" style="display: none;" aria-label="Reproducir o pausar música">
    </button>

    <script type="module" src="js/index.js"></script>
</body>

</html>
